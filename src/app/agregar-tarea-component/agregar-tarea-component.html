<div class="container mt-5 text-center">
    <h2 class="justify-content-center">Agregar tarea</h2>
    <div class="mt-3 d-flex justify-content-center">
        <input type="text"
                #tareaInput
               class="form-control mb-2 w-50"
               placeholder="Escribe una tarea">
    </div>

    <div class="d-flex justify-content-center">
        <button class="btn btn-dark"
        (click)="agregarTarea(tareaInput.value); tareaInput.value=''">
        Agregar tarea
        </button>
    </div>


    <div class="mt-3 text-center">
        @if(tarea){            

        <ul class="list-group">
        <li class="list-group-item list-group-item-light" aria-current="true">{{tarea}}</li>
        </ul>

        }

    </div>
</div>
