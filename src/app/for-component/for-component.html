<div class="container mt-1 text-center">

    <h2>@For</h2>

    <div class="mt-3 text-center">                   

        <ul class="list-group w-50-mx-auto">
            @for (tarea of tareas; track tarea) {
                <li class="list-group-item list-group-item-dark" aria-current="true">{{tarea}}</li>
            }
        </ul>        

    </div>
   

<div class="mt-3 d-flex justify-content-center">
    <input type="text" #tareaInput class="form-control mb-2 w-50" placeholder="Nueva tarea">
</div>

<div class="d-flex justify-content-center">
    <button class="btn btn-warning w-30"
    (click)="agregarTarea(tareaInput.value); tareaInput.value=''">
    Agregar tarea      

    </button>

</div>



</div>
